services:
  db:
    image: postgres:16-alpine
    container_name: trip-visualizer-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bonvoyage}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-bonvoyage}
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonvoyage} -d ${POSTGRES_DB:-bonvoyage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-visualizer:
    image: ${APP_IMAGE:-ghcr.io/aymericlefeyer/bon-voyage:latest}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    container_name: trip-visualizer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "42069:42069"
    environment:
      - NODE_ENV=production
      - PORT=42069
      - DATABASE_URL=postgres://${POSTGRES_USER:-bonvoyage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bonvoyage}
      - APP_URL=${APP_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}

volumes:
  pgdata:
