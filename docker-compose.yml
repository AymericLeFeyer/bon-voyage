services:
  trip-visualizer:
    build: .
    container_name: trip-visualizer
    restart: unless-stopped
    ports:
      - "42069:42069"
    volumes:
      # Persistance de la bdd SQLite sur l'hôte (homelab)
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=42069
      - DATABASE_PATH=/app/data/trips.db
      # --- Emails d'invitation (optionnel) ---
      # Renseignées dans le .env à côté du compose (ou les « Environment
      # variables » d'une stack Portainer) ; vides = mode "console" (lien
      # d'invitation copiable dans l'UI).
      # ⚠️ Ces lignes sont indispensables : sans elles, les variables de la
      # stack servent seulement à l'interpolation et n'entrent pas dans le
      # conteneur.
      # APP_URL=https://voyage.votre-domaine.com
      # RESEND_API_KEY=re_xxxxxxxxxxxx
      # EMAIL_FROM=Bon Voyage <invitations@votre-domaine.com>
      - APP_URL=${APP_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
