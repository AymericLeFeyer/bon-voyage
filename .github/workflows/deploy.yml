name: Déploiement

# Build → publication de l'image sur GHCR → redéploiement de la stack Portainer.
# Le webhook n'est appelé que si TOUTES les étapes précédentes passent.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.env.example'
      - '.gitignore'
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

# Un seul déploiement à la fois ; un push plus récent annule le précédent.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # Le bundle Vite est produit par le build de l'image (étape suivante) :
      # ici on ne vérifie que les types, c'est bien plus rapide.
      - name: TypeScript (tsc -b)
        run: npx tsc -b

  image:
    name: Build & push de l'image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # requis pour pousser sur ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action met le nom du dépôt en minuscules (obligatoire pour GHCR).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # `npm run build` tourne dans le Dockerfile : si le front ne build pas,
      # ce step échoue et rien n'est poussé ni déployé.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

